<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#111614">
  <title>Página no encontrada | AAS Jurídico</title>
  <link rel="icon" type="image/svg+xml" href="/src/img/logo-iso.svg">
  <link rel="stylesheet" href="/css/fonts.css?v=11">
  <link rel="stylesheet" href="/css/main.css?v=11">
  <script>
    (function () {
      try {
        if (localStorage.getItem('aoz-theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f5f7f4');
        }
      } catch (e) {}
    })();
  </script>
  <style>
    .notfound {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: var(--sp-7) var(--gutter);
      text-align: center;
    }
    .notfound__code {
      font-family: var(--mono);
      font-size: 1.4rem;
      letter-spacing: 0.3em;
      color: var(--brand);
    }
    .notfound h1 {
      font-family: var(--serif);
      font-size: clamp(3.2rem, 2.4rem + 2.4vw, 4.8rem);
      font-weight: 600;
      line-height: 1.12;
      margin: 1.6rem 0;
    }
    .notfound p { color: var(--text-dim); max-width: 48rem; margin: 0 auto 3.2rem; }
    .notfound__actions { display: flex; gap: 1.6rem; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
<main class="notfound">
  <div>
    <p class="notfound__code">ERROR 404</p>
    <h1>Esta página no existe</h1>
    <p>Es posible que el enlace esté mal escrito o que la página se haya movido. Puedes volver al inicio o escribirme directamente.</p>
    <div class="notfound__actions">
      <a href="/" class="btn-gold">Volver al inicio</a>
      <a href="https://wa.me/573027400632?text=Hola%2C%20quiero%20consultar%20sobre..." class="btn-outline-green" target="_blank" rel="noopener noreferrer">Escribir por WhatsApp<span class="sr-only"> (se abre en una pestaña nueva)</span></a>
    </div>
  </div>
</main>
</body>
</html>
